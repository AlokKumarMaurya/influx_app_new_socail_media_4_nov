name: influx_app
description: "A comprehensive Flutter application for the Influx influencer marketing and social community platform, featuring discover dashboard, campaign pitching, and dynamic feeds."
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.3
  get_storage: ^2.1.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  dio: ^5.9.0
  alice: ^2.0.0
  alice_dio: ^1.4.0
  intl: ^0.20.2
  carousel_slider: ^5.1.1
  hugeicons: ^1.1.5
  image_picker: ^1.2.1
  emoji_picker_flutter: ^4.4.0
  video_player: ^2.11.1
  chewie: ^1.13.0
  photo_view: ^0.15.0
  share_plus: ^13.3.0
  flutter_widget_from_html_core: ^0.17.0
  gal: ^2.3.0
  path_provider: ^2.1.5
  visibility_detector: ^0.4.0+2
  video_thumbnail: ^0.5.3
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  file_picker: ^12.0.0
  fl_chart: ^1.2.0
  flutter_secure_storage: ^10.3.1
  app_links: ^7.0.0
  flutter_stripe: ^11.5.0
  razorpay_flutter: ^1.3.7
  webview_flutter: ^4.10.0
  agora_rtc_engine: ^6.5.0
  permission_handler: ^13.0.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^18.0.1
  onesignal_flutter: ^5.2.12
  record: ^6.0.0
  geolocator: ^13.0.2
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  package_info_plus: ^10.2.1
  pinput: 6.0.2
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  http_parser: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/videos/
    - assets/images/img/
    - assets/audio/

dependency_overrides:
  # video_thumbnail 0.5.6 uses jcenter() and pins AGP 4.1.0,
  # which breaks Gradle 9 / AGP 9 builds. Use the AGP 9-compatible fix.
  video_thumbnail:
    git:
      url: https://github.com/ameyanaik11/video_thumbnail.git
      ref: cfdd3cc599773aba4e8c866c4ccf1f7713e8af48

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
