name: Android build validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - chore/flutter-3-51-compatibility
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Flutter Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --verbose

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: influx-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
