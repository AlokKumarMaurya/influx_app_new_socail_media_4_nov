name: Android Play Store App Bundle
# Release version is maintained in pubspec.yaml.

on:
  push:
    branches:
      - chore/flutter-3-51-compatibility
    paths:
      - 'pubspec.yaml'
      - 'android/**'
      - 'lib/**'
      - '.github/workflows/android-playstore-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-playstore-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-aab:
    name: Build signed Play Store AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: android/keystore.jks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Play Store signing secrets
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the four Android upload-keystore secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Print toolchain and app version
        run: |
          flutter --version
          dart --version
          java -version
          grep '^version:' pubspec.yaml

      - name: Restore Android upload keystore
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release Android App Bundle
        run: flutter build appbundle --release --no-pub --verbose

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: influx-playstore-aab-v${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
